[project]
name = "vaultshield"
version = "1.0.0"
description = "Academic client-side encrypted credential vault"
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gui: requires a graphical display", "integration: real local TLS sockets"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
